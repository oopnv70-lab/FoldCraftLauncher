name: Build
on:
  pull_request:
  push:
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"
      - "version_map.json"
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release after build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      tag:
        description: "Release tag, used only when release=true"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release_build:
    if: ${{ github.repository_owner == 'FCL-Team' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    name: Build for ${{matrix.arch}}
    strategy:
      matrix:
        arch: ["arm64"]
      fail-fast: false
    env:
      FCL_KEYSTORE_PASSWORD: ${{ secrets.FCL_KEYSTORE_PASSWORD }}
      CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
      OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"
      - name: Build ${{matrix.arch}} .apk
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease -Darch=${{ matrix.arch }} --no-daemon
      - name: Upload apk
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v6
        with:
          name: app-${{matrix.arch}}
          path: FCL/build/outputs/apk/release/*
        #  retention-days: 1

  debug_build:
    if: ${{ (github.repository_owner != 'FCL-Team' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/') }}
    name: Build for ${{matrix.arch}}
    strategy:
      matrix:
        arch: ["arm64"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"
      - name: Build ${{matrix.arch}} .apk
        run: |
          chmod +x gradlew
          ./gradlew assemblefordebug -Darch=${{ matrix.arch }} --no-daemon
      - name: Upload apk
        uses: actions/upload-artifact@v6
        with:
          name: app-${{matrix.arch}}
          path: FCL/build/outputs/apk/fordebug/*
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: FoldCraftLauncher ${{ github.event.inputs.tag }}
          body: |
            FoldCraftLauncher ${{ github.event.inputs.tag }}

            第一个正式版。

            构建信息：
            - 架构：arm64
            - 构建类型：fordebug
            - 基于提交：${{ github.sha }}

            主要改动：
            - 修复整合包/下载任务重复点击仍继续下载的问题。
            - TaskDialog 新增 showAndStart()，显示弹窗与启动任务原子绑定。
            - 已有下载任务时提示“已有下载任务进行中，请等待完成”，并阻止新的 executor.start()。
            - GitHub Actions 改为只构建 arm64。
          files: FCL/build/outputs/apk/fordebug/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
